name: CI C++

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compiler le projet
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ls -lh build/tekbook_app build/run_tests

  unit-tests:
    runs-on: ubuntu-24.04
    needs: compile
    steps:
      - uses: actions/checkout@v6
      - name: Lancer les tests
        run: ./build/run_tests
