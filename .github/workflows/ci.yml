name: CI C++

on:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - name: Restaurer le cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-ubuntu24-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Installer ccache si nécessaire
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
      - name: Compiler le projet
        run: |
          ccache -z
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j2
          ccache -s
          ls -lh build/tekbook_app build/run_tests
      - name: Publier les binaires
        uses: actions/upload-artifact@v7
        with:
          name: tekbook-binaires
          path: |
            build/tekbook_app
            build/run_tests
          retention-days: 7
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-24.04
    needs: compile
    steps:
      - uses: actions/checkout@v6
      - name: Télécharger les binaires
        uses: actions/download-artifact@v8
        with:
          name: tekbook-binaires
          path: build
      - name: Lancer les tests
        run: |
          chmod +x build/run_tests
          ./build/run_tests

  smoke-test:
    runs-on: ubuntu-24.04
    needs: compile
    steps:
      - name: Télécharger les binaires
        uses: actions/download-artifact@v8
        with:
          name: tekbook-binaires
          path: build
      - name: Vérifier le démarrage de Tekbook
        run: |
          chmod +x build/tekbook_app
          ./build/tekbook_app

  static-analysis:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Installer cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
      - name: Analyser le code C++
        run: cppcheck --enable=warning --error-exitcode=1 --std=c++17 -I include src

  build-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [unit-tests, smoke-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Construire et publier l’image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA:0:8}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$image" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          echo "Image publiée : $image"
