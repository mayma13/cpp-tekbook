name: CI C++

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - name: Restaurer le cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-ubuntu24-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Installer ccache si nécessaire
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
      - name: Compiler le projet
        run: |
          ccache -z
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j2
          ccache -s
          ls -lh build/tekbook_app build/run_tests
      - name: Publier les binaires
        uses: actions/upload-artifact@v7
        with:
          name: tekbook-binaires
          path: |
            build/tekbook_app
            build/run_tests
          retention-days: 7
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-24.04
    needs: compile
    steps:
      - uses: actions/checkout@v6
      - name: Télécharger les binaires
        uses: actions/download-artifact@v8
        with:
          name: tekbook-binaires
          path: build
      - name: Lancer les tests
        run: |
          chmod +x build/run_tests
          ./build/run_tests
