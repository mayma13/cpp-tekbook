name: Démo masquage

on:
  workflow_dispatch:

permissions: {}

jobs:
  masking-demo:
    runs-on: ubuntu-24.04
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Vérifier le masquage de la valeur fictive
        run: |
          test -n "$DEMO_TOKEN" || { echo "DEMO_TOKEN est absent"; exit 1; }
          printf 'Valeur fictive dans le journal : %s\n' "$DEMO_TOKEN"
